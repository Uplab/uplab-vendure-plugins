codecov:
  notify:
    # Two uploads per commit: the merged unit + sql.js e2e report (`checks`, node 22) and the Postgres e2e
    # report (`e2e-postgres`). Statuses wait for both, so a half-merged report never fails the project check.
    after_n_builds: 2

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        # Informational: hard thresholds are enforced by vitest in CI.
        informational: true

comment:
  layout: 'condensed_header, diff, components'
  after_n_builds: 2

component_management:
  individual_components:
    - component_id: turbosms
      name: vendure-plugin-turbosms
      paths:
        - packages/vendure-plugin-turbosms/**
    - component_id: unified-slug
      name: vendure-plugin-unified-slug
      paths:
        - packages/vendure-plugin-unified-slug/**
    - component_id: nova-poshta
      name: vendure-plugin-nova-poshta
      paths:
        - packages/vendure-plugin-nova-poshta/**
    - component_id: exchange-rates
      name: vendure-plugin-exchange-rates
      paths:
        - packages/vendure-plugin-exchange-rates/**
    - component_id: change-history
      name: vendure-plugin-change-history
      paths:
        - packages/vendure-plugin-change-history/**
