coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        # Informational: hard thresholds are enforced by vitest in CI.
        informational: true

comment:
  layout: 'condensed_header, diff, components'

component_management:
  individual_components:
    - component_id: turbosms
      name: vendure-plugin-turbosms
      paths:
        - packages/vendure-plugin-turbosms/**
