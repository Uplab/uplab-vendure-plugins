packages:
  - 'packages/*'

# Dependencies whose install scripts are allowed to run (pnpm >= 11).
allowBuilds:
  '@apollo/protobufjs': true
  '@swc/core': true
  '@tailwindcss/oxide': true
  bcrypt: true
  better-sqlite3: true
  esbuild: true
  msw: true
  # Optional native dep of @vendure/core 3.8 (linear-time regex filters on SQLite); without it
  # Vendure falls back to the built-in RegExp, which is all the sql.js tests and dev server need.
  re2: false
  sharp: true
  unrs-resolver: true
