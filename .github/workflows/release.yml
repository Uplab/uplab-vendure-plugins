name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # Required for npm trusted publishing (OIDC) — no NPM_TOKEN secret is used.
  id-token: write

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing requires npm >= 11.5.1; the npm bundled with Node 22 is older.
      - name: Update npm
        run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Create version PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm run version
          # scripts/release.mjs publishes with the npm CLI directly (not `changeset publish`,
          # which would shell out to `pnpm publish` — see the script header) and then runs
          # `changeset tag`. With OIDC there is no NPM_TOKEN: npm mints a short-lived token
          # from the id-token permission above and attaches provenance automatically.
          publish: node scripts/release.mjs
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
