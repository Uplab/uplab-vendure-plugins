name: Preview release

# Continuous preview builds via pkg.pr.new: every PR gets installable URLs for the
# plugin packages, without touching npm. Requires the pkg.pr.new GitHub App to be
# installed on the repository.
on:
  pull_request:

permissions: {}

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: pkg.pr.new
    if: github.repository == 'Uplab/uplab-vendure-plugins'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Publish preview packages
        run: pnpm dlx pkg-pr-new publish './packages/vendure-plugin-*' --pnpm --compact --comment=update
