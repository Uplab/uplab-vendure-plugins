name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Tokenless Codecov upload via GitHub OIDC.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build must run before typecheck: dev-server resolves the workspace
      # plugins' types from their dist/ output.
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test (with coverage)
        run: pnpm test:coverage

      - name: Upload coverage to Codecov
        if: matrix.node == 22
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/lcov.info
          use_oidc: true
          # Without this the action exits 0 even when Codecov rejects the upload
          # ("Repository not found"), and CI stays green while no coverage lands.
          fail_ci_if_error: true

  package-hygiene:
    name: Package hygiene
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: publint + attw (tarball checks)
        run: pnpm check:packages

      - name: knip (unused files, exports, dependencies)
        run: pnpm knip

      - name: Release dry-run
        run: node scripts/release.mjs --dry-run

  # Terminal job: the single required status check for branch protection,
  # stable regardless of the matrix shape.
  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    needs: [checks, package-hygiene]
    if: always()
    permissions: {}
    steps:
      - name: Fail if any needed job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All checks passed."
