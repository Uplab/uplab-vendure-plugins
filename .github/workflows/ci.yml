name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Tokenless Codecov upload via GitHub OIDC.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build must run before typecheck: dev-server resolves the workspace
      # plugins' types from their dist/ output.
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test (with coverage)
        run: pnpm test:coverage

      - name: Upload coverage to Codecov
        if: matrix.node == 22
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/lcov.info
          use_oidc: true
          # Without this the action exits 0 even when Codecov rejects the upload
          # ("Repository not found"), and CI stays green while no coverage lands.
          fail_ci_if_error: true

  package-hygiene:
    name: Package hygiene
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: publint + attw (tarball checks)
        run: pnpm check:packages

      - name: knip (unused files, exports, dependencies)
        run: pnpm knip

      - name: Release dry-run
        run: node scripts/release.mjs --dry-run

  # The suites that need a real second database connection (the change history's committed-row
  # before-state, savepoints). Everything else runs on sql.js in `checks`, where these specs skip.
  e2e-postgres:
    name: e2e (Postgres)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Tokenless Codecov upload via GitHub OIDC.
      id-token: write
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: change_history_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CHANGE_HISTORY_E2E_PG_URL: postgres://postgres:postgres@localhost:5432/change_history_e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Run from the root so the root coverage config applies. Thresholds are off: this suite alone covers
      # only the Postgres paths; Codecov merges this report with the `checks` upload and the vitest
      # thresholds there stay the gate.
      - name: Change history on Postgres (with coverage)
        run: >-
          pnpm vitest run --coverage
          --coverage.thresholds.lines=0 --coverage.thresholds.statements=0
          --coverage.thresholds.functions=0 --coverage.thresholds.branches=0
          --project @uplab/vendure-plugin-change-history
          packages/vendure-plugin-change-history/e2e/change-history-postgres.e2e-spec.ts

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage/lcov.info
          flags: postgres
          use_oidc: true
          fail_ci_if_error: true

  # Terminal job: the single required status check for branch protection,
  # stable regardless of the matrix shape.
  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    needs: [checks, package-hygiene, e2e-postgres]
    if: always()
    permissions: {}
    steps:
      - name: Fail if any needed job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All checks passed."
