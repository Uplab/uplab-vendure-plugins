<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Currency exchange rate">
  <rect width="512" height="512" rx="112" fill="#255774"/>
  <!-- swap arrows: one arrow drawn ending at the top, placed twice by rotation -->
  <g transform="rotate(45 256 256)">
    <path d="M 126 181 A 150 150 0 0 1 236 107" fill="none" stroke="#65abcb" stroke-width="40" stroke-linecap="round"/>
    <polygon points="238,54 238,158 314,106" fill="#65abcb" stroke="#65abcb" stroke-width="16" stroke-linejoin="round"/>
  </g>
  <g transform="rotate(225 256 256)">
    <path d="M 126 181 A 150 150 0 0 1 236 107" fill="none" stroke="#65abcb" stroke-width="40" stroke-linecap="round"/>
    <polygon points="238,54 238,158 314,106" fill="#65abcb" stroke="#65abcb" stroke-width="16" stroke-linejoin="round"/>
  </g>
  <!-- coins -->
  <circle cx="172" cy="172" r="92" fill="#f5f3f5"/>
  <circle cx="340" cy="340" r="92" fill="#f4b952"/>
</svg>
